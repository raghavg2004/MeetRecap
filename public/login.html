<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetRecap — Sign In</title>
    <meta name="description" content="Sign in to MeetRecap — the premium multi-user video collaboration platform." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      .login-page { padding-top: 60px; }
      .login-page { min-height: 100vh; }
    </style>
  </head>
  <body>
    <!-- Animated Background -->
    <div class="bg-canvas">
      <div class="bg-blob bg-blob-1"></div>
      <div class="bg-blob bg-blob-2"></div>
      <div class="bg-blob bg-blob-3"></div>
    </div>
    <div class="bg-grid"></div>

    <main class="app-shell">
      <div class="login-page">

        <!-- Brand -->
        <div class="login-brand">
          <div class="brand-orb">
            <i class="bi bi-camera-video-fill" style="color:#fff;font-size:1rem;position:relative;z-index:1;"></i>
          </div>
          <div class="brand-info">
            <span class="brand-sub">Video Collaboration</span>
            <span class="brand-name">MeetRecap</span>
          </div>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
          <div class="auth-heading">
            <p class="eyebrow">Get Started</p>
            <h1>Welcome <span class="grad-text">back</span></h1>
            <p class="text-muted" style="margin-top:6px;">Sign in or create your account to continue.</p>
          </div>

          <!-- Tab Switcher -->
          <div class="auth-tabs" role="tablist">
            <button id="tabSignIn" class="auth-tab active" role="tab" aria-selected="true">
              <i class="bi bi-box-arrow-in-right"></i>
              Sign In
            </button>
            <button id="tabRegister" class="auth-tab" role="tab" aria-selected="false">
              <i class="bi bi-person-plus"></i>
              Register
            </button>
          </div>

          <!-- Sign In Form -->
          <form id="loginForm" class="auth-form active" novalidate>
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email Address</label>
              <div class="input-wrap">
                <i class="bi bi-envelope input-icon"></i>
                <input id="loginEmail" type="email" placeholder="you@example.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input id="loginPassword" type="password" placeholder="••••••••" minlength="8" required autocomplete="current-password" />
                <button type="button" class="input-action" id="toggleLoginPwd" aria-label="Toggle password visibility">
                  <i class="bi bi-eye" id="loginPwdIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-brand w-full" id="loginSubmitBtn" style="margin-top:6px;">
              <div class="spinner"></div>
              <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i>&nbsp; Sign In</span>
            </button>
          </form>

          <!-- Register Form -->
          <form id="registerForm" class="auth-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="registerName">Display Name</label>
              <div class="input-wrap">
                <i class="bi bi-person input-icon"></i>
                <input id="registerName" type="text" maxlength="24" placeholder="Your full name" required autocomplete="name" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="registerEmail">Email Address</label>
              <div class="input-wrap">
                <i class="bi bi-envelope input-icon"></i>
                <input id="registerEmail" type="email" placeholder="you@example.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="registerPassword">Password <span class="text-muted">(min. 8 characters)</span></label>
              <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input id="registerPassword" type="password" placeholder="••••••••" minlength="8" required autocomplete="new-password" />
                <button type="button" class="input-action" id="toggleRegisterPwd" aria-label="Toggle password visibility">
                  <i class="bi bi-eye" id="registerPwdIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-brand w-full" id="registerSubmitBtn" style="margin-top:6px;">
              <div class="spinner"></div>
              <span class="btn-text"><i class="bi bi-person-check"></i>&nbsp; Create Account</span>
            </button>
          </form>

          <!-- Status -->
          <p id="statusText" class="status" style="margin-top:14px;text-align:center;"></p>
        </div>

        <!-- Feature Badges -->
        <div class="login-features">
          <div class="feature-badge"><span><i class="bi bi-shield-lock-fill"></i></span> End-to-End Secure</div>
          <div class="feature-badge"><span><i class="bi bi-people-fill"></i></span> Up to 12 Participants</div>
          <div class="feature-badge"><span><i class="bi bi-calendar-check"></i></span> Schedule Meetings</div>
          <div class="feature-badge"><span><i class="bi bi-chat-dots-fill"></i></span> Live Chat</div>
        </div>

      </div>
    </main>

    <script src="./runtime-config.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
